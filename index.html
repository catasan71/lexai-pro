<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO primară -->
    <title>LexAI Pro — Asistent Juridic AI pentru Antreprenori Români</title>
    <meta name="description" content="Generează contracte conforme legislației române, analizează riscuri juridice și redactează documente profesionale cu AI în secunde. 46 tipuri de contracte, export PDF & Word." />
    <meta name="keywords" content="contracte AI, asistent juridic, legislatie romana, generator contracte, analiza riscuri, somatie plata, notificare juridica, procura, LexAI" />
    <meta name="author" content="LexAI Pro SRL" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lexai.pro" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://lexai.pro" />
    <meta property="og:title"       content="LexAI Pro — Asistent Juridic AI pentru Antreprenori" />
    <meta property="og:description" content="Contracte, somații, decizii HR, procuri și analize de riscuri generate cu AI în secunde. Conform legislației române 2025." />
    <meta property="og:image"       content="https://lexai.pro/og-image.png" />
    <meta property="og:locale"      content="ro_RO" />
    <meta property="og:site_name"   content="LexAI Pro" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="LexAI Pro — Asistent Juridic AI" />
    <meta name="twitter:description" content="Generează contracte și documente juridice conforme cu AI antrenat pe legislația română." />
    <meta name="twitter:image"       content="https://lexai.pro/og-image.png" />

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#070d1a" />
    <meta name="application-name" content="LexAI Pro" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LexAI Pro",
      "description": "Asistent juridic AI pentru antreprenorii români — generare contracte, analiză riscuri, documente juridice.",
      "url": "https://lexai.pro",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": [
        { "@type": "Offer", "name": "Starter", "price": "49", "priceCurrency": "RON", "billingIncrement": "P1M" },
        { "@type": "Offer", "name": "Pro Business", "price": "149", "priceCurrency": "RON", "billingIncrement": "P1M" }
      ],
      "inLanguage": "ro",
      "creator": { "@type": "Organization", "name": "LexAI Pro SRL", "url": "https://lexai.pro" }
    }
    </script>

    <!-- Google Fonts: Space Grotesk (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Mammoth.js pentru citire DOCX (upload în Analiză) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
